name: AntiVirus Whitelisting

on:
  workflow_call:
    inputs:
      url:
        description: "Url to the file to upload"
        required: true
        type: string
      avast:
        description: "Upload to Avast"
        required: false
        type: boolean
        default: true
      kaspersky:
        description: "Upload to Kaspersky"
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      url:
        description: "Url to the file to upload"
        required: true
        type: string
      avast:
        description: "Upload to Avast"
        required: false
        type: boolean
        default: false
      kaspersky:
        description: "Upload to Kaspersky"
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  download-file:
    name: Downloads the file into the VM
    runs-on: ubuntu-slim
    outputs:
      fileName: ${{ steps.extractName.outputs.fileName}}
    env:
      INPUT_URL: ${{ inputs.url }}
    steps:
      - name: Extract file name
        id: extractName
        run: |
          url="${INPUT_URL}"
          echo "fileName=${url##*/}" >> $GITHUB_OUTPUT
      - name: Download file
        run: curl --silent --fail-with-body --proto "=https" -L "${INPUT_URL}" -o "${{steps.extractName.outputs.fileName}}"
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.extractName.outputs.fileName }}
          path: ${{ steps.extractName.outputs.fileName }}
          if-no-files-found: error
  allowlist-kaspersky:
    name: Anti Virus Allowlisting Kaspersky
    runs-on: ubuntu-slim
    needs: download-file
    if: inputs.kaspersky
    steps:
      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.download-file.outputs.fileName }}
          path: upload
      - name: Upload to Kaspersky
        env:
          FILE_NAME: ${{ needs.download-file.outputs.fileName }}
          FTP_USERNAME: ${{ secrets.ALLOWLIST_KASPERSKY_USERNAME }}
          FTP_PASSWORD: ${{ secrets.ALLOWLIST_KASPERSKY_PASSWORD }}
        # server speaks explicit FTPS (plain greeting, then AUTH TLS) despite port 990, hence ftp:// with --ssl-reqd
        run: >
          curl --silent --show-error --fail --ssl-reqd
          --retry 3 --retry-all-errors
          --user "${FTP_USERNAME}:${FTP_PASSWORD}"
          --upload-file "upload/${FILE_NAME}"
          "ftp://allowlist.kaspersky-labs.com:990/"
  allowlist-avast:
    name: Anti Virus Allowlisting Avast
    runs-on: ubuntu-slim
    needs: download-file
    if: inputs.avast
    steps:
      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.download-file.outputs.fileName }}
          path: upload
      - name: Pin Avast host keys
        # obtained via `ssh-keyscan whitelisting.avast.com`
        run: |
          mkdir -p ~/.ssh
          cat >> ~/.ssh/known_hosts <<'EOF'
          whitelisting.avast.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDCZV8IQoy56zwJAowPG7v79vwmWPGI269MYLV1ipyxn
          whitelisting.avast.com ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBJ40OBHpnuq02CSbiJZxIyfSSc7pHVdOrLsdLI2x/PJ9TcKcg8CAPjJO3dibx3f5BXdFI0gmYbRGj8L2/fymH18=
          whitelisting.avast.com ssh-rsa 
          EOF
      - name: Upload to Avast
        env:
          FILE_NAME: ${{ needs.download-file.outputs.fileName }}
          SFTP_USERNAME: ${{ secrets.ALLOWLIST_AVAST_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.ALLOWLIST_AVAST_PASSWORD }}
        # curl verifies the server against ~/.ssh/known_hosts
        run: >
          curl --silent --show-error --fail
          --retry 3 --retry-all-errors
          --user "${SFTP_USERNAME}:${SFTP_PASSWORD}"
          --upload-file "upload/${FILE_NAME}"
          "sftp://whitelisting.avast.com/data/"